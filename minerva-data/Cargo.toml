[package]
name = "minerva-data"
version = "0.3.1"
edition = "2021"
description = "Data management library for the Minerva System"
authors = ["Lucas S. Vieira <lucasvieira@protonmail.com>"]

[lib]
path = "src/lib.rs"

[dependencies]
minerva-rpc = {path = "../minerva-rpc"}
diesel = {version = "2.3.6", features = ["postgres", "extras", "chrono"]}
diesel-derive-enum = {version = "1.1.2", default-features = false}
bb8 = {version = "0.8", default-features = false}
dotenv = "0.15.0"
serde = {version = "1.0.228", features = ["derive"]}
serde_derive = "1.0.228"
num-derive = "0.4"
num-traits = "0.2"
bigdecimal = "0.4"
serde_json = {version = "1.0", default-features = false, features = ["std"]}
toml = "0.5"
num-bigint = "0.4"
chrono = {version = "0.4", features = ["serde", "clock"]}
mongodb = {version = "2.2.1", default-features = false}
argon2 = {version = "0.4", default-features = false}
rand_core = {version = "0.6", features = ["std"], default-features = false}
tokio = {version = "1.0", features = ["time", "net"]}
